name: Release

# Genera los instaladores (Windows .exe, Debian .deb, Fedora .rpm) y los adjunta
# al release de GitHub al subir una etiqueta vX.Y.Z (o ejecutando el workflow a mano).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  debian:
    # Ubuntu 22.04: glibc antigua para que el .deb funcione en Debian 12+ y Ubuntu 22.04+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            build-essential curl wget file
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: src-tauri/target/release/bundle/deb/*.deb

  fedora:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Dependencias del sistema
        run: |
          dnf install -y git gcc gcc-c++ make curl wget file rpm-build nodejs npm \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel \
            librsvg2-devel openssl-devel libxdo-devel
          npm install -g pnpm@10
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm

  release:
    needs: [windows, debian, fedora]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Favoritos Desktop ${{ github.ref_name }}" \
            --generate-notes
